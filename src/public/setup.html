      minimaxRegionCN: '国内版 — api.minimaxi.com',

      memorySearchSubtitle: '对 MEMORY.md 与 memory/*.md 进行语义检索，需配置嵌入 API（OpenAI、Gemini 或自定义端点）。',
      memorySearchEnabled: '启用内存搜索',
      memorySearchProvider: '嵌入服务',

      memorySearchProviderRemote: '自定义（OpenAI 兼容端点）',

      memorySearchSave: '保存',

  };
  document.addEventListener('alpine:init', () => {
    Alpine.data('setupApp', () => ({
      locale: (typeof localStorage !== 'undefined' && localStorage.getItem('openclaw-locale')) || 'en',
      step: 1,
      totalSteps: 3,
      status: 'Loading...',
      configured: false,
      openclawVersion: '',
      authGroups: [],
      selectedGroup: '',
      authChoices: [],
      selectedAuth: '',
      authSecret: '',
      telegramToken: '',
      discordToken: '',
      slackBotToken: '',
      slackAppToken: '',
      model: '',
      log: '',
      loading: false,
      pairingChannel: '',
      pairingCode: '',
      showPairingModal: false,
      isReady: false,
      tuiEnabled: false,
      exporting: false,
      showExportInfo: false,
      showDevicesModal: false,
      devicesLoading: false,
      devices: [],
      devicesPending: [],
      devicesPaired: [],
      currentModel: '',
      modelApiModel: '',
      modelApiBaseUrl: '',
      modelApiKey: '',
      modelApiLog: '',
      modelApiLoading: false,
      minimaxEndpoint: 'global',
      memorySearchEnabled: true,
      memorySearchProvider: 'auto',
      memorySearchRemoteBaseUrl: '',
      memorySearchRemoteApiKey: '',
      memorySearchLog: '',
      memorySearchLoading: false,

      get currentGroup() {
        return this.authGroups.find(g => g.value === this.selectedGroup);
      },

      t(key) {
        const lang = I18N[this.locale] || I18N.en;
        return lang[key] != null ? lang[key] : (I18N.en[key] || key);
      },

      setLocale(lang) {
        this.locale = lang;
        try { localStorage.setItem('openclaw-locale', lang); } catch (_) {}
        this.status = this.configured ? this.t('statusConfigured') : this.t('statusNotConfigured');
        try { document.title = '🦞 OpenClaw — ' + this.t('pageTitle'); } catch (_) {}
      },

      async init() {
        await this.refreshStatus();
      },

      async httpJson(url, opts = {}) {
        opts.credentials = 'same-origin';
        const res = await fetch(url, opts);
        if (!res.ok) {
          const t = await res.text();
          throw new Error('HTTP ' + res.status + ': ' + (t || res.statusText));
        }
        return res.json();
      },

      async refreshStatus() {
        this.status = this.t('statusLoading');
        try {
          const j = await this.httpJson('/setup/api/status');
          this.configured = j.configured;
          this.openclawVersion = j.openclawVersion || '';
          this.tuiEnabled = j.tuiEnabled || false;
          this.status = j.configured ? this.t('statusConfigured') : this.t('statusNotConfigured');
          this.currentModel = j.currentModel || '';
          if (this.currentModel && !this.modelApiModel) this.modelApiModel = this.currentModel;
          const mpc = j.modelProviderConfig;
          if (mpc && mpc.baseUrl !== undefined) this.modelApiBaseUrl = mpc.baseUrl || '';
          if (mpc?.provider === 'minimax') {
            if ((mpc.baseUrl || '').indexOf('minimaxi.com') >= 0) this.minimaxEndpoint = 'cn';
            else this.minimaxEndpoint = 'global';
          }
          const msc = j.memorySearchConfig;
          if (msc) {
            this.memorySearchEnabled = msc.enabled !== false;
            this.memorySearchProvider = msc.provider || 'auto';
            this.memorySearchRemoteBaseUrl = msc.remoteBaseUrl || '';
          }
          this.authGroups = j.authGroups || [];
          if (this.authGroups.length > 0) {
            this.selectedGroup = this.authGroups[0].value;
            this.updateAuthChoices();
          }
          if (j.channelsAddHelp && j.channelsAddHelp.indexOf('telegram') === -1) {
            this.log += '\nNote: this openclaw build does not list telegram in `channels add --help`. Telegram auto-add will be skipped.\n';
          }
          this.isReady = true;
          try { document.title = '🦞 OpenClaw — ' + this.t('pageTitle'); } catch (_) {}
        } catch (e) {
          this.status = this.t('statusError') + String(e);
          this.isReady = true;
          try { document.title = '🦞 OpenClaw — ' + this.t('pageTitle'); } catch (_) {}
        }
      },

      updateAuthChoices() {
        const group = this.currentGroup;
        this.authChoices = (group && group.options) ? group.options : [];
        if (this.authChoices.length > 0) {
          this.selectedAuth = this.authChoices[0].value;
          if (this.selectedAuth === 'minimax-api-2.5' && !this.model) this.model = 'minimax/MiniMax-M2.5';
        }
      },

      async saveModelApi() {
        const model = (this.modelApiModel || '').trim();
        if (!model) {
          alert(this.t('modelApiModelRequired'));
          return;
        }
        this.modelApiLog = this.t('running') + '\n';
        this.modelApiLoading = true;
        const payload = { model };
        if (this.modelApiBaseUrl !== undefined) payload.baseUrl = (this.modelApiBaseUrl || '').trim();
        if ((this.modelApiKey || '').trim()) payload.apiKey = (this.modelApiKey || '').trim();
        if (model.startsWith('minimax/')) payload.minimaxEndpoint = this.minimaxEndpoint;
        try {
          const res = await fetch('/setup/api/model', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const j = await res.json().catch(() => ({}));
          this.modelApiLog += j.output || res.statusText || 'Done.\n';
          if (j.ok) {
            this.currentModel = model;
            if (payload.apiKey) this.modelApiKey = '';
            await this.refreshStatus();
          }
        } catch (e) {
          this.modelApiLog += 'Error: ' + String(e) + '\n';
        } finally {
          this.modelApiLoading = false;
        }
      },

      async saveMemorySearch() {
        this.memorySearchLog = this.t('running') + '\n';
        this.memorySearchLoading = true;
        const payload = {
          enabled: this.memorySearchEnabled,
          provider: this.memorySearchProvider || 'auto'
        };
        if (this.memorySearchProvider === 'remote') {
          payload.remoteBaseUrl = (this.memorySearchRemoteBaseUrl || '').trim();
          if ((this.memorySearchRemoteApiKey || '').trim()) payload.remoteApiKey = (this.memorySearchRemoteApiKey || '').trim();
        }
        try {
          const res = await fetch('/setup/api/memory-search', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const j = await res.json().catch(() => ({}));
          this.memorySearchLog += j.output || res.statusText || 'Done.\n';
          if (j.ok) await this.refreshStatus();
          if (j.ok && payload.remoteApiKey) this.memorySearchRemoteApiKey = '';
        } catch (e) {
          this.memorySearchLog += 'Error: ' + String(e) + '\n';
        } finally {
          this.memorySearchLoading = false;
        }
      },

      nextStep() {
        if (this.step < this.totalSteps) this.step++;
      },

      prevStep() {
        if (this.step > 1) this.step--;
      },

      setMinimaxRegion(region) {
        this.minimaxEndpoint = region;
        this.modelApiBaseUrl = region === 'cn' ? 'https://api.minimaxi.com/anthropic' : 'https://api.minimax.io/anthropic';
      },

      async runSetup() {
        const payload = {
          authChoice: this.selectedAuth,
          authSecret: this.authSecret,
          model: this.model,
          minimaxEndpoint: this.selectedGroup === 'minimax' ? this.minimaxEndpoint : undefined,
          telegramToken: this.telegramToken,
          discordToken: this.discordToken,
          slackBotToken: this.slackBotToken,
          slackAppToken: this.slackAppToken
        };

        this.log = 'Running...\n';
        this.loading = true;

        try {
          const res = await fetch('/setup/api/run', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const text = await res.text();
          let j;
          try { j = JSON.parse(text); } catch (_e) { j = { ok: false, output: text }; }
          this.log += (j.output || JSON.stringify(j, null, 2));
          await this.refreshStatus();
        } catch (e) {
          this.log += '\nError: ' + String(e) + '\n';
        } finally {
          this.loading = false;
        }
      },

      openPairingModal() {
        this.pairingChannel = '';
        this.pairingCode = '';
        this.showPairingModal = true;
      },

      async approvePairing() {
        const channel = this.pairingChannel.trim().toLowerCase();
        if (channel !== 'telegram' && channel !== 'discord') {
          alert(this.t('channelMustBe'));
          return;
        }
        const code = this.pairingCode.trim();
        if (!code) {
          alert(this.t('enterPairingCode'));
          return;
        }
        this.showPairingModal = false;
        this.log += '\nApproving pairing for ' + channel + '...\n';

        try {
          const res = await fetch('/setup/api/pairing/approve', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ channel: channel, code: code })
          });
          const t = await res.text();
          let result;
          try { result = JSON.parse(t); } catch (_e) { result = { ok: false, output: t }; }
          if (result.ok) {
            const msg = result.output || this.t('pairApproved');
            this.log += '✓ ' + msg + '\n';
            alert('✓ ' + msg.trim());
          } else {
            const msg = result.output || result.error || this.t('pairFailed');
            this.log += '✗ Failed: ' + msg + '\n';
            alert('✗ ' + this.t('pairFailed') + ': ' + msg.trim());
          }
        } catch (e) {
          this.log += '✗ Error: ' + String(e) + '\n';
          alert('✗ ' + this.t('pairFailed') + ': ' + String(e));
        }
      },

      async resetSetup() {
        if (!confirm(this.t('resetConfirm'))) return;
        this.log = 'Resetting...\n';
        this.loading = true;

        try {
          const res = await fetch('/setup/api/reset', { method: 'POST', credentials: 'same-origin' });
          const t = await res.text();
          this.log += t + '\n';
          await this.refreshStatus();
        } catch (e) {
          this.log += 'Error: ' + String(e) + '\n';
        } finally {
          this.loading = false;
        }
      },

      async runDoctor() {
        this.log = 'Running doctor...\n';
        this.loading = true;

        try {
          const res = await fetch('/setup/api/doctor', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' }
          });
          const text = await res.text();
          let j;
          try { j = JSON.parse(text); } catch (_e) { j = { ok: false, output: text }; }
          this.log += (j.output || JSON.stringify(j, null, 2));
          if (j.ok) {
            this.log += '\n✓ Doctor completed successfully\n';
          } else {
            this.log += '\n✗ Doctor found issues\n';
          }
        } catch (e) {
          this.log += 'Error: ' + String(e) + '\n';
        } finally {
          this.loading = false;
        }
      },

      async exportData() {
        this.exporting = true;
        this.log = 'Preparing export...\n';

        try {
          const res = await fetch('/setup/api/export', { credentials: 'same-origin' });
          if (!res.ok) {
            const text = await res.text();
            let j;
            try { j = JSON.parse(text); } catch (_e) { j = { error: text }; }
            this.log += '✗ Export failed: ' + (j.error || j.output || text) + '\n';
            return;
          }

          const disposition = res.headers.get('content-disposition') || '';
          const match = disposition.match(/filename="?([^"]+)"?/);
          const filename = match ? match[1] : 'openclaw-export.zip';

          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);

          this.log += '✓ Export downloaded: ' + filename + '\n';
          this.showExportInfo = true;
        } catch (e) {
          this.log += '✗ Export error: ' + String(e) + '\n';
        } finally {
          this.exporting = false;
        }
      },

      async openDevicesModal() {
        this.showDevicesModal = true;
        await this.loadDevices();
      },

      async loadDevices() {
        this.devicesLoading = true;
        try {
          const j = await this.httpJson('/setup/api/devices');
          const d = j.data;
          if (d) {
            if (Array.isArray(d)) {
              this.devicesPending = d.filter(x => x.status === 'pending');
              this.devicesPaired = d.filter(x => x.status !== 'pending');
            } else {
              this.devicesPending = d.pending || d.pendingRequests || d.requests || [];
              this.devicesPaired = d.devices || d.paired || d.approved || [];
            }
          } else {
            this.devicesPending = [];
            this.devicesPaired = [];
          }
          if (j.raw) {
            this.log += '[devices] ' + j.raw.trim() + '\n';
          }
        } catch (e) {
          this.log += '✗ Failed to load devices: ' + String(e) + '\n';
        } finally {
          this.devicesLoading = false;
        }
      },

      async approveDevice(requestId) {
        this.devicesLoading = true;
        try {
          const body = requestId ? { requestId } : {};
          const res = await fetch('/setup/api/devices/approve', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body)
          });
          const j = await res.json();
          if (j.ok) {
            this.log += '✓ Device approved\n';
          } else {
            this.log += '✗ Approve failed: ' + (j.output || j.error || 'Unknown error') + '\n';
          }
          await this.loadDevices();
        } catch (e) {
          this.log += '✗ Error: ' + String(e) + '\n';
          this.devicesLoading = false;
        }
      },

      async rejectDevice(requestId) {
        this.devicesLoading = true;
        try {
          const res = await fetch('/setup/api/devices/reject', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ requestId })
          });
          const j = await res.json();
          if (j.ok) {
            this.log += '✓ Device rejected\n';
          } else {
            this.log += '✗ Reject failed: ' + (j.output || j.error || 'Unknown error') + '\n';
          }
          await this.loadDevices();
        } catch (e) {
          this.log += '✗ Error: ' + String(e) + '\n';
          this.devicesLoading = false;
        }
      },

    }));
  });
  </script>

              <div class="channel-header">
                <div class="channel-icon">
                  <svg class="icon-md" viewBox="0 0 24 24" fill="currentColor"><path d="M5.042 15.165a2.528 2.528 0 01-2.52 2.523A2.528 2.528 0 010 15.165a2.527 2.527 0 012.522-2.52h2.52v2.52zm1.271 0a2.527 2.527 0 012.521-2.52 2.527 2.527 0 012.521 2.52v6.313A2.528 2.528 0 018.834 24a2.528 2.528 0 01-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 01-2.521-2.52A2.528 2.528 0 018.834 0a2.528 2.528 0 012.521 2.522v2.52H8.834zm0 1.271a2.528 2.528 0 012.521 2.521 2.528 2.528 0 01-2.521 2.521H2.522A2.528 2.528 0 010 8.834a2.528 2.528 0 012.522-2.521h6.312zm10.124 2.521a2.528 2.528 0 012.522-2.521A2.528 2.528 0 0124 8.834a2.528 2.528 0 01-2.52 2.521h-2.522V8.834zm-1.271 0a2.528 2.528 0 01-2.521 2.521 2.528 2.528 0 01-2.521-2.521V2.522A2.528 2.528 0 0115.166 0a2.528 2.528 0 012.521 2.522v6.312zm-2.521 10.124a2.528 2.528 0 012.521 2.522A2.528 2.528 0 0115.166 24a2.528 2.528 0 01-2.521-2.522v-2.522h2.521zm0-1.271a2.528 2.528 0 01-2.521-2.521 2.528 2.528 0 012.521-2.521h6.312A2.528 2.528 0 0124 15.165a2.528 2.528 0 01-2.52 2.521h-6.313z"/></svg>
                </div>
                <span class="channel-name">Slack</span>
              </div>
              <input x-model="slackBotToken" type="password" :placeholder="t('slackBotPlaceholder')" class="input" />
              <input x-model="slackAppToken" type="password" :placeholder="t('slackAppPlaceholder')" class="input" style="margin-top:0.75rem" />
            </div>
          </div>
        </div>
      </div>

      <div x-show="step === 3" x-transition:enter="fade-slide-enter" x-transition:enter-start="fade-slide-start" x-transition:enter-end="fade-slide-end">
        <div class="card">
          <h2 class="card-title" x-text="t('runSetupTitle')"></h2>
          <p class="card-subtitle" x-text="t('runSetupSubtitle')"></p>

          <div class="config-summary">
            <h3 class="config-summary-title" x-text="t('configSummary')"></h3>
            <dl>
              <div class="config-row">
                <dt x-text="t('provider')"></dt>
                <dd x-text="selectedGroup || '—'"></dd>
              </div>
              <div class="config-row">
                <dt x-text="t('auth')"></dt>
                <dd x-text="selectedAuth || '—'"></dd>
              </div>
              <div class="config-row">
                <dt x-text="t('model')"></dt>
                <dd x-text="model || t('default')"></dd>
              </div>
              <div class="config-row">
                <dt x-text="t('channels')"></dt>
                <dd>
                  <span x-show="telegramToken" class="badge badge-sky">Telegram</span>
                  <span x-show="discordToken" class="badge badge-indigo">Discord</span>
                  <span x-show="slackBotToken && slackAppToken" class="badge badge-green">Slack</span>
                  <span x-show="!telegramToken && !discordToken && !(slackBotToken && slackAppToken)" class="text-muted" x-text="t('none')"></span>
                </dd>
              </div>
            </dl>
          </div>

          <div class="btn-row">
            <button @click="runSetup()" :disabled="loading" class="btn btn-primary">
              <span x-show="!loading" x-text="t('runSetupBtn')"></span>
              <span x-show="loading" style="display:inline-flex;align-items:center;gap:0.5rem">
                <svg class="spinner-inline" fill="none" viewBox="0 0 24 24"><circle style="opacity:0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path style="opacity:0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                <span x-text="t('running')"></span>
              </span>
            </button>
            <button @click="resetSetup()" :disabled="loading" class="btn btn-ghost" x-text="t('reset')"></button>
          </div>

          <div x-show="log" class="log-output" x-text="log"></div>

          <p class="text-xs text-muted mt-4" x-text="t('resetNote')"></p>
        </div>
      </div>

      <div class="nav-row">
        <button
          x-show="step > 1"
          @click="prevStep()"
          class="nav-back"
        >
          <svg class="icon-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          <span x-text="t('back')"></span>
        </button>
        <div x-show="step === 1"></div>
        <button
          x-show="step < totalSteps"
          @click="nextStep()"
          class="nav-next"
        >
          <span x-text="t('next')"></span>
          <svg class="icon-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <div x-show="showDevicesModal" x-cloak class="modal-overlay" @click.self="showDevicesModal = false">
      <div class="modal-card modal-lg">
        <div class="modal-header">
          <h3 class="modal-title" x-text="t('modalManageDevices')"></h3>
          <div class="modal-actions">
            <button @click="loadDevices()" :disabled="devicesLoading" class="btn-icon">
              <svg class="icon-sm" :class="devicesLoading && 'spinning'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
            <button @click="showDevicesModal = false" class="btn-icon">
              <svg class="icon-sm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </div>

        <p class="modal-desc" x-text="t('modalManageDevicesDesc')"></p>

        <button @click="approveDevice()" :disabled="devicesLoading" class="btn-violet mb-4">
          <span x-show="!devicesLoading" x-text="t('approveLatestRequest')"></span>
          <span x-show="devicesLoading" style="display:inline-flex;align-items:center;justify-content:center;gap:0.5rem">
            <svg class="spinner-inline" fill="none" viewBox="0 0 24 24"><circle style="opacity:0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path style="opacity:0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            <span x-text="t('loading')"></span>
          </span>
        </button>

        <div class="section-block">
          <h4 class="section-heading" x-text="t('pendingRequests')"></h4>
          <div x-show="devicesPending.length === 0 && !devicesLoading" class="empty-state" x-text="t('noPendingRequests')"></div>
          <div class="device-list">
            <template x-for="req in devicesPending" :key="req.requestId || req.id">
              <div class="device-pending">
                <div class="min-w-0 flex-1">
                  <p class="device-pending-id truncate" x-text="req.requestId || req.id"></p>
                  <p x-show="req.createdAt" class="device-pending-date" x-text="req.createdAt ? new Date(req.createdAt).toLocaleString() : ''"></p>
                </div>
                <div class="device-actions">
                  <button @click="approveDevice(req.requestId || req.id)" :disabled="devicesLoading" class="btn-emerald" x-text="t('approve')"></button>
                  <button @click="rejectDevice(req.requestId || req.id)" :disabled="devicesLoading" class="btn-red-sm" x-text="t('reject')"></button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="section-block">
          <h4 class="section-heading" x-text="t('pairedDevices')"></h4>
          <div x-show="devicesPaired.length === 0 && !devicesLoading" class="empty-state" x-text="t('noPairedDevices')"></div>
          <div class="device-list">
            <template x-for="dev in devicesPaired" :key="dev.deviceId || dev.id">
              <div class="device-paired">
                <div class="min-w-0 flex-1">
                  <p class="device-paired-id truncate" x-text="dev.deviceId || dev.id"></p>
                  <p class="device-paired-meta">
                    <span x-show="dev.role" x-text="dev.role" class="device-role"></span>
                    <span x-show="dev.createdAt" x-text="dev.createdAt ? new Date(dev.createdAt).toLocaleString() : ''"></span>
                  </p>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <div x-show="showExportInfo" x-cloak class="modal-overlay" @click.self="showExportInfo = false">
      <div class="modal-card modal-md">
        <h3 class="modal-title mb-4" x-text="t('unzipTitle')"></h3>
        <p class="text-sm text-muted mb-4" x-text="t('unzipDesc')"></p>
        <div class="section-block">
          <p class="label">macOS / Linux</p>
          <code class="code-block">unzip -P YOUR_PASSWORD openclaw-export-*.zip</code>
        </div>
        <div class="section-block">
          <p class="label">Windows (PowerShell)</p>
          <p class="text-sm text-muted" x-html="t('unzipWindows')"></p>
        </div>
        <div class="section-block">
          <p class="label">Using 7z CLI</p>
          <code class="code-block">7z x -pYOUR_PASSWORD openclaw-export-*.zip</code>
        </div>
        <button @click="showExportInfo = false" class="btn-close-full" x-text="t('close')"></button>
      </div>
    </div>

    <div x-show="showPairingModal" x-cloak class="modal-overlay" @click.self="showPairingModal = false">
      <div class="modal-card modal-sm">
        <h3 class="modal-title mb-4" x-text="t('approveChannelAccess')"></h3>
        <div class="form-group">
          <label class="label" x-text="t('channelLabel')"></label>
          <select x-model="pairingChannel" class="select">
            <option value="" x-text="t('selectChannel')"></option>
            <option value="telegram">Telegram</option>
            <option value="discord">Discord</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label" x-text="t('pairingCodeLabel')"></label>
          <input x-model="pairingCode" type="text" :placeholder="t('pairingCodePlaceholder')" class="input" />
        </div>
        <div class="btn-pair">
          <button @click="approvePairing()" class="btn btn-primary" x-text="t('approve')"></button>
          <button @click="showPairingModal = false" class="btn btn-close-full" style="margin-top:0" x-text="t('cancel')"></button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
